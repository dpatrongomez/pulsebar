[package]
name = "pulsebar"
version = "0.1.0"
edition = "2024"
description = "PulseBar: app-centric activity monitor and process inspector for macOS developers (MCP + CLI)"
license = "MIT"
default-run = "pulsebar"

[[bin]]
name = "pulsebar"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:tray-icon", "dep:image", "dep:objc2", "dep:objc2-app-kit", "dep:dispatch2"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38"
eframe = { version = "0.33", optional = true, default-features = false, features = ["glow", "default_fonts", "accesskit"] }
tray-icon = { version = "0.26", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
plist = "1.10.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
dispatch2 = { version = "0.3", optional = true }

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

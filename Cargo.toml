[package]
name = "pulsebar"
version = "0.1.0"
edition = "2024"
description = "PulseBar: app-centric activity monitor and process inspector for developers on macOS and Linux (MCP + CLI)"
license = "MIT"
default-run = "pulsebar"

[[bin]]
name = "pulsebar"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:tray-icon", "dep:ksni", "dep:image", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-user-notifications", "dep:block2", "dep:dispatch2"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38"
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
plist = "1.10.3"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "block2", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSSet", "NSString"] }
objc2-user-notifications = { version = "0.3", optional = true, default-features = false, features = ["std", "block2", "bitflags", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "0.3", optional = true }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Status icons over D-Bus (StatusNotifierItem); pure Rust, so no GTK at build or run time.
ksni = { version = "0.3", optional = true, default-features = false, features = ["blocking", "async-io"] }

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
